workflows:
  web-verify:
    name: Users & Posts · verify
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      node: 24
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: develop
          include: true
          source: true
        - pattern: main
          include: true
          source: true
        - pattern: '*'
          include: true
          source: false
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install
        script: npm ci
      - name: Typecheck, lint, tests with coverage, build, ratchets
        script: scripts/verify.sh
      - name: Coverage badge
        script: scripts/coverage-badge.sh
    artifacts:
      - coverage/**
      - dist/**
    publishing:
      email:
        recipients:
          - 112357917+ernestgonzalezv@users.noreply.github.com
        notify:
          success: false
          failure: true
